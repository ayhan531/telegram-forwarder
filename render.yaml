services:
  - type: web
    name: telegram-forwarder
    env: python
    buildCommand: pip install -r requirements.txt && pip install gunicorn uvicorn
    startCommand: gunicorn app:app -k uvicorn.workers.UvicornWorker --bind 0.0.0.0:$PORT --workers 1 --timeout 120
services:
  - type: web
    name: telegram-forwarder
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn -w 1 -k uvicorn.workers.UvicornWorker app:app --bind 0.0.0.0:10000
    healthCheckPath: /health
    plan: starter
    disk:
      name: tg-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: DATA_DIR
        value: /data
      - key: PORT
        value: 10000
      - key: SESSION_SECRET
        generateValue: true
