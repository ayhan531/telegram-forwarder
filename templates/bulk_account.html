<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Toplu Hesap Yükleme — Telegram Forwarder</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
<div class="page">

  <aside class="sidebar">
    <div class="sidebar-logo">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M22 2L11 13M22 2L15 22l-4-9-9-4 20-7z"/></svg>
      Forwarder
    </div>
    <span class="nav-section">Menü</span>
    <a class="nav-item" href="/"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>Panel</a>
    <a class="nav-item active" href="/accounts/bulk"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 00-3-3.87M16 3.13a4 4 0 010 7.75"/></svg>Toplu Yükle</a>
    <div class="sidebar-footer"><div class="status-pill"><div class="pulse"></div>Sistem Aktif</div></div>
  </aside>

  <main class="main">
    <div class="main-header">
      <h1>📂 Toplu .session Yükleme</h1>
      <p>Klasördeki tüm .session dosyaları tek seferde yüklenir</p>
    </div>

    <div class="card" style="max-width:560px">

      <div class="alert alert-warn" style="margin-bottom:1.5rem">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:16px;height:16px"><path d="M10.29 3.86L1.82 18a2 2 0 001.71 3h16.94a2 2 0 001.71-3L13.71 3.86a2 2 0 00-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
        <span>Tüm .session dosyaları <b>aynı API ID ve Hash</b> ile oluşturulmuş olmalı.</span>
      </div>

      <form action="/accounts/bulk_load" method="POST">
        <div class="field">
          <label>📁 Klasör Yolu</label>
          <input type="text" name="folder_path" placeholder="/Users/adın/Desktop/sessions" required>
          <div class="field-hint">İçinde sadece .session dosyaları olan klasörün tam yolu</div>
        </div>
        <div class="field">
          <label>API ID <a href="https://my.telegram.org/auth" target="_blank" style="color:var(--primary);font-size:.78rem;font-weight:400">→ my.telegram.org</a></label>
          <input type="text" name="api_id" placeholder="12345678" required>
        </div>
        <div class="field">
          <label>API Hash</label>
          <input type="text" name="api_hash" placeholder="abc123..." required>
        </div>
        <button type="submit" class="btn btn-primary btn-lg btn-block mt-2">
          📂 Tüm Hesapları Yükle
        </button>
      </form>

      <div style="text-align:center;margin-top:1rem">
        <a href="/" style="color:var(--muted2);font-size:.85rem;text-decoration:none">← Ana sayfaya dön</a>
      </div>
    </div>
  </main>
</div>
</body>
</html>
